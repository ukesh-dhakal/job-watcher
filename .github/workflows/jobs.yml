name: job-watcher

on:
  schedule:
    - cron: "7 * * * *"   # every hour
  workflow_dispatch:

permissions:
  contents: write          # needed to commit seen.json

concurrency:
  group: job-watcher
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: node index.js
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Save seen jobs
        run: |
          if [ -n "$(git status --porcelain seen.json)" ]; then
            git config user.name "job-watcher"
            git config user.email "actions@users.noreply.github.com"
            git add seen.json
            git commit -m "update seen jobs"
            git push
          fi
